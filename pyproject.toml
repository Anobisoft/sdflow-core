[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdflow-core"
version = "1.0.0"
description = "Core Engine for Cross-Platform Server-Driven UI Rendering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown>=3.6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sdui_core*"]

